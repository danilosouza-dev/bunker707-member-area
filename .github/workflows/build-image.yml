name: Imagem do app

# Publica a imagem Docker do app no ghcr.io a cada push na main (sem deploy automatico: o deploy na
# Hetzner e um passo manual do runbook, docs/20-runbook-hetzner.md). Em PR que mexe no build da imagem,
# so constroi, sem publicar, para a quebra aparecer antes do merge.
#
# NEXT_PUBLIC_* entram no JavaScript do navegador no build: vem de *variaveis* do repositorio
# (Settings > Secrets and variables > Actions > Variables), nao de secrets, porque sao valores publicos.
# Sem elas a imagem sobe (o /api/health responde) mas o app pede configuracao do Supabase.

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - package.json
      - package-lock.json
      - next.config.ts
      - .github/workflows/build-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build${{ github.event_name == 'pull_request' && ' (sem publicar)' || ' e publicar no ghcr.io' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Versao curta do commit
        id: version
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags e labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build e push
        uses: docker/build-push-action@v7
        with:
          context: .
          # Servidores Hetzner cogitados (CX33, CPX32, CCX13) sao x86. Para um CAX (Arm) acrescente linux/arm64.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=sha-${{ steps.version.outputs.short_sha }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ vars.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
