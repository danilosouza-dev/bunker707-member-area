# Nomes tecnicos do Bunker Members (o kit do produto licenciado), num arquivo so (docs/32 §11.7 e A10).
#
# Decidido em 11/11/2026 (docs/32 item 17): os nomes que o comprador ve no servidor (a lista de containers, os volumes,
# as pastas, o servico de backup) sao neutros, `membros`, e nunca levam a nossa marca nem a dele. A nossa producao
# continua com os nomes dela (infra/compose/docker-compose.yml, `bunker707`) ate a migracao planejada. Todo comando do
# kit (infra/kit/membros e os scripts que ele chama) tira daqui o projeto do compose, os containers, os volumes, a rede,
# as pastas, o servico de backup e as marcas dos backups, e nenhum outro arquivo do kit escreve o nome (as guardas em
# tests/kit-membros.test.mjs e tests/kit-compose.test.mjs conferem). O compose do kit
# (infra/compose/docker-compose.kit.yml) le KIT_NOME e KIT_PASTA_CERTIFICADOS do ambiente, que lib-kit.sh exporta:
# trocar o nome e trocar KIT_NOME aqui, e so.
#
# Este arquivo e codigo do pacote, carregado como root pelos comandos: o comprador nao edita. O que e dele (o destino do
# backup, as chaves de acesso ao destino, a retencao) fica no arquivo de segredos. Uma variavel com o mesmo nome no
# ambiente vale por cima do padrao (o ensaio local e os testes trocam as pastas assim).
# shellcheck shell=bash

KIT_NOME="${KIT_NOME:-membros}"

# Compose: o projeto, o servico do banco e o que e da escola de verdade (o ensaio nunca toca nada disto).
KIT_PROJETO_COMPOSE="${KIT_PROJETO_COMPOSE:-$KIT_NOME}"
KIT_SERVICO_BANCO="${KIT_SERVICO_BANCO:-db}"
# Os 8 containers do compose do kit (sem Realtime, Supavisor, Edge Runtime, Studio e meta: docs/32 §11.6).
KIT_CONTAINERS_DA_ESCOLA="${KIT_CONTAINERS_DA_ESCOLA:-$KIT_NOME-db $KIT_NOME-auth $KIT_NOME-rest $KIT_NOME-storage $KIT_NOME-imgproxy $KIT_NOME-envoy $KIT_NOME-app $KIT_NOME-caddy}"
KIT_VOLUMES_DA_ESCOLA="${KIT_VOLUMES_DA_ESCOLA:-${KIT_PROJETO_COMPOSE}_db-config ${KIT_PROJETO_COMPOSE}_caddy-config}"
KIT_REDE_DA_ESCOLA="${KIT_REDE_DA_ESCOLA:-${KIT_PROJETO_COMPOSE}_default}"

# Pastas do pacote e do servidor. KIT_PASTA_PACOTE vem de lib-kit.sh (a pasta onde o pacote foi aberto).
KIT_PASTA_COMPOSE="${KIT_PASTA_COMPOSE:-$KIT_PASTA_PACOTE/infra/compose}"
# O compose do kit fica na mesma pasta do da producao: as pastas de dados, o .env e os arquivos do banco, do Envoy e
# dos modelos de e-mail sao os mesmos caminhos (o restore.sh le daqui).
KIT_ARQUIVO_COMPOSE="${KIT_ARQUIVO_COMPOSE:-$KIT_PASTA_COMPOSE/docker-compose.kit.yml}"
KIT_ARQUIVO_SEGREDOS="${KIT_ARQUIVO_SEGREDOS:-$KIT_PASTA_COMPOSE/.env}"
KIT_PASTA_DADOS_DO_BANCO="${KIT_PASTA_DADOS_DO_BANCO:-$KIT_PASTA_COMPOSE/volumes/db/data}"
KIT_PASTA_STORAGE="${KIT_PASTA_STORAGE:-$KIT_PASTA_COMPOSE/volumes/storage}"
# Estado do kit (situacao do backup, kit de recuperacao pendente, marca do modo de restauracao): /var/lib/<nome>.
KIT_PASTA_ESTADO="${KIT_PASTA_ESTADO:-/var/lib/$KIT_NOME}"
# Os certificados e a conta ACME do Caddy (o /data dele): fora do pacote e dos volumes do Docker, para uma reinstalacao
# reaproveitar o certificado em vez de pedir outro (o Let's Encrypt limita 5 certificados iguais por semana).
KIT_PASTA_CERTIFICADOS="${KIT_PASTA_CERTIFICADOS:-$KIT_PASTA_ESTADO/caddy}"
# Onde o instalador abre o Pacote da versao (o preparo do servidor cria a pasta vazia).
KIT_PASTA_INSTALACAO="${KIT_PASTA_INSTALACAO:-/opt/$KIT_NOME}"
# A exportacao do banco de cada noite e a pasta do ensaio: /var/backups/<nome>.
KIT_PASTA_BACKUP="${KIT_PASTA_BACKUP:-/var/backups/$KIT_NOME}"
# Onde a chave de recuperacao digitada fica enquanto o comando roda: na memoria (/dev/shm), nunca no disco.
KIT_PASTA_TEMPORARIA="${KIT_PASTA_TEMPORARIA:-/dev/shm}"
KIT_ARQUIVO_TRAVA="${KIT_ARQUIVO_TRAVA:-/run/lock/$KIT_NOME-backup.lock}"

# Backup diario pelo systemd, no horario de Brasilia.
KIT_UNIDADE_BACKUP="${KIT_UNIDADE_BACKUP:-$KIT_NOME-backup}"
KIT_PASTA_SYSTEMD="${KIT_PASTA_SYSTEMD:-/etc/systemd/system}"
KIT_HORA_DO_BACKUP="${KIT_HORA_DO_BACKUP:-03:30}"

# restic: as marcas de todo backup do kit. O host e fixo (nao e o nome da maquina): o servidor novo de uma recuperacao
# continua a mesma linha do tempo do servidor perdido, e a retencao trata os dois como um so.
KIT_BACKUP_HOST="${KIT_BACKUP_HOST:-$KIT_NOME}"
KIT_BACKUP_TAG="${KIT_BACKUP_TAG:-$KIT_NOME}"

# Ensaio de restauracao: o prefixo do container e o rotulo pelo qual as sobras de um ensaio interrompido sao achadas, e
# o teto de memoria e de processador (num servidor de 4 GB, com a escola no ar). O ensaio so comeca se a memoria livre
# do servidor (MemAvailable) cobre o teto mais a folga que fica para a escola.
KIT_ENSAIO_PREFIXO="${KIT_ENSAIO_PREFIXO:-$KIT_NOME-ensaio}"
KIT_ENSAIO_ROTULO="${KIT_ENSAIO_ROTULO:-$KIT_NOME.ensaio}"
KIT_ENSAIO_MEMORIA="${KIT_ENSAIO_MEMORIA:-512m}"
KIT_ENSAIO_FOLGA_MEMORIA="${KIT_ENSAIO_FOLGA_MEMORIA:-256m}"
KIT_ENSAIO_CPUS="${KIT_ENSAIO_CPUS:-1}"
KIT_ENSAIO_ESPERA="${KIT_ENSAIO_ESPERA:-300}"

# Os scripts que o kit reaproveita (docs/32 §11.7).
KIT_SCRIPT_RESTORE="${KIT_SCRIPT_RESTORE:-$KIT_PASTA_PACOTE/infra/scripts/restore.sh}"
KIT_SCRIPT_MIGRAR="${KIT_SCRIPT_MIGRAR:-$KIT_PASTA_PACOTE/infra/kit/migrar.sh}"
KIT_SCRIPT_FUMACA="${KIT_SCRIPT_FUMACA:-$KIT_PASTA_PACOTE/infra/scripts/smoke.sh}"
KIT_SCRIPT_PREPARAR="${KIT_SCRIPT_PREPARAR:-$KIT_PASTA_PACOTE/infra/kit/preparar-servidor.sh}"
KIT_SCRIPT_MEMBROS="${KIT_SCRIPT_MEMBROS:-$KIT_PASTA_PACOTE/infra/kit/membros}"

# ---- Instalador (infra/kit/instalar; docs/32 §3.2 e §11.7; docs/20 §9D) ---------------------------------------------
# Os passos feitos, para rodar de novo continuar de onde parou. Sem segredo e sem dado de aluno (0644).
KIT_ARQUIVO_INSTALACAO="${KIT_ARQUIVO_INSTALACAO:-$KIT_PASTA_ESTADO/instalacao.json}"
# O comando de operacao no PATH do administrador: um link para o membros da pasta da instalacao.
KIT_LINK_DO_COMANDO="${KIT_LINK_DO_COMANDO:-/usr/local/sbin/membros}"
# A chave publica que assina o manifesto do Pacote da versao: Ed25519, a chave publica em DER (SubjectPublicKeyInfo) em
# base64, numa linha so; mais de uma, separadas por espaco, na troca de chave. Vazia ate a cerimonia das chaves: o
# instalador confere o sha256 de todo arquivo sempre, e so recusa o pacote sem assinatura quando ha chave aqui. A chave
# que ja esta no servidor (o kit.conf da instalacao) vale por cima da do pacote que chega (docs/20 §9D).
KIT_CHAVE_DO_PACOTE="${KIT_CHAVE_DO_PACOTE:-}"
# O Emissor de licencas, so para a conferencia de saida do servidor: o endereco que a area usa vem gravado na imagem.
KIT_EMISSOR_URL="${KIT_EMISSOR_URL:-https://licencas-api.bunker707.com.br}"
# O provedor de e-mail da primeira fase (o Resend, docs/32 §3.1): a API e o SMTP. As portas, na ordem de preferencia:
# a 587 e a alternativa 2587 (STARTTLS) e a 465 (TLS direto); o Auth so faz TLS direto na 465, entao a 2465 fica fora.
KIT_EMAIL_API_URL="${KIT_EMAIL_API_URL:-https://api.resend.com}"
KIT_EMAIL_SMTP_HOST="${KIT_EMAIL_SMTP_HOST:-smtp.resend.com}"
KIT_EMAIL_SMTP_PORTAS="${KIT_EMAIL_SMTP_PORTAS:-587 2587 465}"
# Os minimos do servidor (docs/32 §3.1): 2 vCPU; 4 GB de memoria (o sistema mostra uns 3,8 GB de um plano de 4 GB);
# 40 GB de disco (uns 37 GiB) e folga livre para as imagens, o banco e o backup do dia.
KIT_MINIMO_CPUS="${KIT_MINIMO_CPUS:-2}"
KIT_MINIMO_MEMORIA_MB="${KIT_MINIMO_MEMORIA_MB:-3500}"
KIT_MINIMO_DISCO_GB="${KIT_MINIMO_DISCO_GB:-37}"
KIT_MINIMO_DISCO_LIVRE_GB="${KIT_MINIMO_DISCO_LIVRE_GB:-10}"
# Quanto o instalador espera, em segundos: o dominio de envio ser verificado pelo provedor de e-mail, o certificado sair
# e o agendador de minuto rodar a primeira vez.
KIT_ESPERA_DOMINIO_EMAIL="${KIT_ESPERA_DOMINIO_EMAIL:-900}"
KIT_ESPERA_CERTIFICADO="${KIT_ESPERA_CERTIFICADO:-300}"
KIT_ESPERA_AGENDADOR="${KIT_ESPERA_AGENDADOR:-180}"
# Arquivos do sistema que a conferencia le (os testes trocam).
KIT_ARQUIVO_OS_RELEASE="${KIT_ARQUIVO_OS_RELEASE:-/etc/os-release}"
KIT_ARQUIVO_MEMINFO="${KIT_ARQUIVO_MEMINFO:-/proc/meminfo}"
