{{ $JIBRI_RECORDING_RESOLUTION := .Env.JIBRI_RECORDING_RESOLUTION | default "1920x1080" -}}
# A tela virtual do gravador (Xorg com o driver dummy), a 60 Hz (docs/30 D137). Montado por cima de
# /defaults/xorg-video-dummy.conf da imagem (docker-compose.yml): o script de partida da imagem passa este arquivo pelo
# tpl a cada subida e o Xorg sobe com o resultado. A primeira linha e a ultima secao sao as da imagem: o modo da tela e
# o de nome igual a JIBRI_RECORDING_RESOLUTION.
#
# Por que este arquivo existe: o da imagem (tag stable-11248) traz os modos do xpra, feitos para caber num relogio de
# pixel baixo, e a taxa de atualizacao de cada um e o relogio dividido pelo total de pontos da linha vezes o total de
# linhas: 1920x1080 da 23,53 MHz / (2072 x 1135) = 10 Hz, e 1280x720 da 27,41 MHz / (1448 x 757) = 25 Hz. O Chrome do
# gravador desenha no ritmo da tela, entao em 1080p a pagina saia com 10 imagens por segundo, e o ffmpeg, que filma a
# tela a 30 quadros, repetia cada imagem 3 vezes (a live de 24/11/2026: 10 voltas de desenho por segundo em todas as
# medidas, com a maquina de 20 a 27%). O proprio projeto ja tinha posto o 720p a 60 Hz (docker-jitsi-meet #1778, abril de
# 2024); a linha saiu numa mudanca seguinte do arquivo (#1846).
#
# Os dois modos abaixo sao os padroes de TV (CEA-861), exatos em 60 Hz: 148,50 MHz / (2200 x 1125) e
# 74,25 MHz / (1650 x 750). 60 e nao 30: o ffmpeg le a tela a 30 quadros sem combinar o instante com o Chrome, e com a
# tela no dobro do ritmo cada quadro do video ja esta desenhado quando ele le. O driver aceita relogio de 11 a 300 MHz.
# So existem os dois tamanhos que o jibri-up grava (1920x1080 e, na reserva cpx32, 1280x720): um tamanho novo pede uma
# linha nova aqui, com 30 Hz ou mais (tests/infra-jibri-tela.test.mjs confere).

Section "ServerFlags"
  Option "DontVTSwitch" "true"
  Option "AllowMouseOpenFail" "true"
  Option "PciForceNone" "true"
  Option "AutoEnableDevices" "false"
  Option "AutoAddDevices" "false"
EndSection

Section "Device"
  Identifier "dummy_videocard"
  Driver "dummy"
  Option "ConstantDPI" "true"
  VideoRam 192000
EndSection

Section "Monitor"
  Identifier "dummy_monitor"
  HorizSync   5.0 - 1000.0
  VertRefresh 5.0 - 200.0
  Modeline "1920x1080" 148.50 1920 2008 2052 2200 1080 1084 1089 1125
  Modeline "1280x720" 74.25 1280 1390 1430 1650 720 725 730 750
EndSection

Section "Screen"
  Identifier "dummy_screen"
  Device "dummy_videocard"
  Monitor "dummy_monitor"
  DefaultDepth 24
  SubSection "Display"
    Viewport 0 0
    Depth 24
    Modes {{ $JIBRI_RECORDING_RESOLUTION | quote }}
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier   "dummy_layout"
  Screen       "dummy_screen"
EndSection
