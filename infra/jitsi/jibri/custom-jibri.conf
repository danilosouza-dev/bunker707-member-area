// O ffmpeg da gravacao (docs/30 D138). A imagem do Jibri inclui este arquivo no fim do jibri.conf dela
// (/config/custom-jibri.conf, copiado para /run/jibri/config a cada subida), entao o que esta aqui vence o padrao.
//
// O gravador grava com o ffmpeg que o jibri-up poe em /usr/local/bin/ffmpeg (o 6.1 compilado do codigo oficial por
// infra/jitsi/jibri/ffmpeg-gravacao.sh; se a compilacao falhar, um atalho para o da imagem). Com o 7.1 da imagem, a
// entrada de audio segura a captura da tela e o arquivo sai com 3 a 6 imagens por segundo.
//
// O Jibri chama o ffmpeg-jibri.sh, que espera 2 s e vira esse ffmpeg (D140): sem a espera o Jibri deixa de ouvir o
// ffmpeg na partida e o Jicofo manda parar a gravacao em 90 s.
jibri.ffmpeg.ffmpeg-binary = "/usr/local/bin/ffmpeg-jibri"

// As entradas do reference.conf do Jibri, com uma opcao a mais: -isync 0 no audio, que alinha o comeco do audio pelo
// comeco da tela. Sem ela o ffmpeg zera o relogio de cada entrada pelo proprio comeco, e um audio que abre depois da
// tela fica adiantado na gravacao (D140).
jibri.ffmpeg.input-linux = [
  "-f", "x11grab"
  "-draw_mouse", "0"
  "-r", ${jibri.ffmpeg.framerate}
  "-s", ${jibri.ffmpeg.resolution}
  "-thread_queue_size", ${jibri.ffmpeg.queue-size}
  "-i", ":0.0+0,0"
  "-isync", "0"
  "-f", ${jibri.ffmpeg.audio-source}
  "-thread_queue_size", ${jibri.ffmpeg.queue-size}
  "-i", ${jibri.ffmpeg.audio-device}
]
