// O ffmpeg da gravacao (docs/30 D138). A imagem do Jibri inclui este arquivo no fim do jibri.conf dela
// (/config/custom-jibri.conf, copiado para /run/jibri/config a cada subida), entao o que esta aqui vence o padrao.
//
// O gravador grava com o ffmpeg que o jibri-up poe em /usr/local/bin/ffmpeg (o 6.1 compilado do codigo oficial por
// infra/jitsi/jibri/ffmpeg-gravacao.sh; se a compilacao falhar, um atalho para o da imagem). Com o 7.1 da imagem, a
// entrada de audio segura a captura da tela e o arquivo sai com 3 a 6 imagens por segundo.
jibri.ffmpeg.ffmpeg-binary = "/usr/local/bin/ffmpeg"
